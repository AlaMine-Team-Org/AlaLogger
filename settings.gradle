pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        // ModDevGradle — used by :common-mc for the NeoForm-provided Minecraft
        // classpath, and later by the NeoForge module itself.
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases')
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net/')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'alalogger'

includeBuild('build-logic')

// Three modules, mirroring how the code is allowed to depend on Minecraft:
//
//   common     pure Java — HTTP, redaction, file discovery, config, history.
//              No Minecraft on the classpath at all, so it is testable with
//              plain JUnit and reusable by anything (a panel plugin, a CLI).
//   common-mc  the loader-neutral Minecraft layer: the Brigadier command tree
//              and chat components. Compiled against NeoForm, so one command
//              tree serves every loader instead of one copy per loader.
//   fabric     the entrypoint and the loader-specific hooks. Deliberately thin.
//
// NeoForge, Paper/Folia and Velocity modules slot in beside `fabric` without
// touching the two shared ones — that is the whole point of the split.
include('common')
include('common-mc')
include('fabric')
include('neoforge')

// The Minecraft version this build targets: versions/<mc>.properties, chosen by
// `mc` (gradle.properties holds the default, `-Pmc=26.2` overrides it). Loaded
// into every project before its build script runs, so `minecraft_version` and the
// rest resolve exactly as they did when they were plain gradle.properties keys.
//
// Three refusals, each cheaper than what it prevents:
//   - an unknown version names the ones that exist instead of failing later on a
//     missing property;
//   - a file without one of the keys stops here rather than building a jar
//     whose metadata says "${fabric_version}";
//   - a key left in gradle.properties as well would be a second source of truth,
//     and which one wins is not something anyone should have to remember.
def mc = providers.gradleProperty('mc').get()
def versionsDir = new File(settingsDir, 'versions')
def versionFile = new File(versionsDir, "${mc}.properties")
if (!versionFile.isFile()) {
    def known = versionsDir.listFiles()*.name
            .findAll { it.endsWith('.properties') }
            .collect { it - '.properties' }
            .sort()
    throw new GradleException("Unknown Minecraft version '${mc}'. Supported: ${known.join(', ')} (versions/*.properties).")
}
def mcProps = new Properties()
versionFile.withInputStream { mcProps.load(it) }

def required = ['minecraft_version', 'minecraft_version_range', 'neo_form_version',
                'fabric_version', 'fabric_loader_version', 'neoforge_version']
def missing = required.findAll { !mcProps.getProperty(it) }
if (missing) {
    throw new GradleException("versions/${mc}.properties is missing: ${missing.join(', ')}")
}
if (mcProps.getProperty('minecraft_version') != mc) {
    throw new GradleException("versions/${mc}.properties says minecraft_version=${mcProps.getProperty('minecraft_version')}")
}
def duplicated = mcProps.stringPropertyNames().findAll { providers.gradleProperty(it).isPresent() }
if (duplicated) {
    throw new GradleException("Set in both gradle.properties (or -P) and versions/${mc}.properties: ${duplicated.sort().join(', ')}")
}

gradle.beforeProject { project ->
    mcProps.each { key, value -> project.ext.set(key as String, value) }
}
