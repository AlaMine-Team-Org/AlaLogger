# =============================================================================
# Minecraft 26.2 "Chaos Cubed" - the older supported version. Build it with
# `./gradlew build -Pmc=26.2`.
#
# See 26.3.properties for how these files are loaded. The values here are the
# ones 0.1.0-0.1.4 shipped with and are deliberately left alone: each one is the
# floor the mod declares, so raising it would ask 26.2 players to update their
# loader for no change of ours.
# =============================================================================

minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
neo_form_version=26.2-1

fabric_version=0.153.0+26.2
fabric_loader_version=0.19.3

neoforge_version=26.2.0.67

# MinecraftForge (not NeoForge). The recommended build on the day Forge support
# was added; like the others, it is the floor the mod declares.
forge_version=65.1.5

# Pack format of the Forge 26.2 MDK pack.mcmeta. Forge refuses a mod without one
# with a warning screen on every launch.
forge_pack_format=107
