plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

// The store description comes from its own file, in UTF-8.
//
// It used to be a key in gradle.properties, which Gradle reads as ISO-8859-1 —
// so an em dash written there reached the jar double-encoded, and the first
// place anybody saw it was a store page. The description is the one value long
// enough to want a character that is not ASCII, and putting it where it can have
// one removes the trap instead of remembering it.
//
// Line breaks fold into spaces so the file can be wrapped for reading while the
// value stays a single line: mod metadata is JSON and TOML, and a raw newline is
// invalid in one of them.
File descriptionFile = rootProject.file('mod_description.txt')

// Said out loud rather than as a FileNotFoundException out of a plugin applied
// to every module, which would fail `clean` and `tasks` too and name nothing.
if (!descriptionFile.isFile()) {
    throw new GradleException("${descriptionFile} is missing. It carries the store description "
            + 'that both fabric.mod.json and neoforge.mods.toml are built from.')
}

description = descriptionFile.getText('UTF-8').replaceAll(/\s+/, ' ').trim()

if (description.isEmpty()) {
    throw new GradleException("${descriptionFile} is empty, and an empty description reaches "
            + 'both store pages exactly as written.')
}

// The TOML template carries this between ''' delimiters, which escape nothing.
// Three quotes in the text would close the literal early and produce a file the
// loader cannot parse - discovered, if at all, by a player whose game will not
// start.
if (description.contains("'''")) {
    throw new GradleException("${descriptionFile} contains ''' , which ends the TOML literal "
            + 'that carries it into neoforge.mods.toml.')
}

repositories {
    mavenCentral()
    // Loom and ModDevGradle add their own repositories to the modules that
    // apply them; this is for the ordinary libraries every module shares.
    maven {
        name = 'NeoForged'
        url = uri('https://maven.neoforged.net/releases')
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fabric'
                url = uri('https://maven.fabricmc.net/')
            }
        }
        filter {
            includeGroupAndSubgroups('net.fabricmc')
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

// Name the deprecated symbols instead of counting them. Mojang and the loaders
// mark a symbol @Deprecated a release or two before removing it, so this is free
// advance notice of the next migration — the alternative is finding out at
// runtime, after the version bump.
//
// Deliberately not -Werror: vanilla deprecates on Mojang's schedule, not ours,
// and a build going red because of someone else's release stops work at a moment
// we did not choose.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
    from(rootProject.file('NOTICE')) {
        rename { "${it}_${mod_id}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

// Build stamp: short git hash + commit time, expanded into alalogger.build.json
// so the mod can report exactly which build uploaded a log. That traceability is
// the point — when a log arrives malformed, "which version produced it" has to
// be answerable from the log itself.
//
// The COMMIT time, never `new Date()`: both values feed processResources inputs,
// so a wall-clock value would make the task out of date every minute and drag
// the whole jar chain with it. While HEAD has not moved, the stamp is stable.
String gitHash = 'dev'
String commitTime = ''
try {
    def git = providers.exec {
        commandLine 'git', 'log', '-1', '--date=format:%Y-%m-%dT%H:%M', '--format=%h%n%cd'
        ignoreExitValue = true
    }
    if (git.result.get().exitValue == 0) {
        List<String> stamp = git.standardOutput.asText.get().trim().readLines()
        if (stamp.size() >= 1 && !stamp[0].trim().isEmpty()) {
            gitHash = stamp[0].trim()
        }
        if (stamp.size() >= 2) {
            commitTime = stamp[1].trim()
        }
    }
} catch (Exception e) {
    // No git on PATH, or a clean export without .git. 'dev' is the documented
    // fallback BuildInfo expects; say so, because in a release build a 'dev'
    // stamp means the artifact cannot be traced back to a commit.
    logger.warn("[{}] could not read the git stamp ({}: {}) — this build will be marked 'dev'.",
            mod_id, e.getClass().getSimpleName(), e.message)
}
String buildTime = System.getenv('ALA_BUILD_TIME')?.trim() ?: (commitTime ?: 'dev')

processResources {
    // Read and write the resources as UTF-8 rather than as whatever this machine
    // defaults to. Without it the encoding of fabric.mod.json depends on who ran
    // the build, which is how the same commit produces two different jars.
    filteringCharset = 'UTF-8'

    var expandProps = [
            'version'                : version,
            'githash'                : gitHash,
            'buildtime'              : buildTime,
            'group'                  : project.group,
            'minecraft_version'      : minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'fabric_version'         : fabric_version,
            'fabric_loader_version'  : fabric_loader_version,
            // Read with findProperty rather than directly: build-logic is applied
            // to every module, and a module that never sees these still has to
            // configure. A missing value would fail the whole build at
            // configuration time instead of only where it is used.
            'neoforge_version'             : findProperty('neoforge_version') ?: '',
            'neoforge_loader_version_range': findProperty('neoforge_loader_version_range') ?: '',
            'mod_name'               : mod_name,
            'mod_author'             : mod_author,
            'mod_id'                 : mod_id,
            'license'                : license,
            'description'            : project.description,
            'java_version'           : java_version
    ]

    // Escaped as JSON for the JSON targets, because that is what they are.
    //
    // fabric.mod.json drops each value between two quotes, so a quote or a
    // backslash in the description would produce a file Fabric refuses to load -
    // while NeoForge, whose template uses a TOML literal, shipped fine. Nothing
    // downstream would have caught it either: the release check greps for the
    // version string rather than parsing the file.
    //
    // This replaces a hand-rolled newline escape that was itself wrong: Groovy's
    // '\\\\n' is a backslash followed by a backslash and an n, so a newline became
    // an escaped backslash rather than a line break. It was unreachable, because
    // the description is folded to one line before it gets here, and wrong is
    // still wrong.
    var escapeJson = { String value ->
        String quoted = groovy.json.JsonOutput.toJson(value)

        quoted.substring(1, quoted.length() - 1)
    }

    var jsonExpandProps = expandProps.collectEntries { key, value ->
        [(key): value instanceof String ? escapeJson(value) : value]
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', "${mod_id}.build.json".toString()]) {
        expand jsonExpandProps
    }

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}
