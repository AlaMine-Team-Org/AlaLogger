modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''

# MinecraftForge has no iconFile key (checked against ModInfo in 26.2 and 26.3):
# the mod-list image is logoFile. NeoForge is the opposite since 26.2 - do not
# copy keys between the two files.
logoFile = "assets/alalogger/icon-128.png"
logoBlur = true

# Forge marks a dependency with mandatory=true; NeoForge's type="required" is not
# a key here at all.
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
