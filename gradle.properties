# =============================================================================
# Ala Logger - single source of truth for versions and mod metadata.
#
# processResources (build-logic/src/main/groovy/multiloader-common.gradle)
# expands these into fabric.mod.json, so anything the metadata needs lives here
# rather than in the version catalog.
#
# KEEP EVERY VALUE ASCII. Gradle reads this file as ISO-8859-1, so a UTF-8
# character arrives in the jar double-encoded: an em dash in the description
# shipped as "alacraft.day .. you get" on the first build here, and the same trap
# once cost AlaIndustrial a mojibake release description. Escapes (\uXXXX) work,
# but are easy to mangle while editing; plain ASCII cannot.
#
# The description was the one value that wanted a character outside ASCII, so it
# no longer lives here: it is mod_description.txt, read as UTF-8 by build-logic.
# =============================================================================

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Must stay off: the configuration cache breaks the IntelliJ + Loom combination
# (FabricMC/fabric-loom#1349). The BUILD cache below is a different thing and is
# safe to keep on.
org.gradle.configuration-cache=false
org.gradle.caching=true

version=0.1.0
group=day.alacraft.alalogger
java_version=25

mod_id=alalogger
mod_name=Ala Logger
mod_author=AlaCraft
license=MIT
# description: see mod_description.txt

# Minecraft 26.2 "Chaos Cubed". Java 25 is mandatory from 26.1 onwards.
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
# Compilation-only Minecraft classpath for the loader-neutral module, in Mojang
# mappings. Yarn does not exist for the 26.x schema, so mojmap is the only option.
neo_form_version=26.2-1

fabric_version=0.153.0+26.2
fabric_loader_version=0.19.3

# NeoForge. The version is the floor the mod declares in neoforge.mods.toml, so
# raising it here raises the requirement players see - keep the Requirements
# section of the store page in step with it.
neoforge_version=26.2.0.67
# The FML loader spec version, not the NeoForge version. Separate on purpose:
# the loader format changes far less often than the platform.
neoforge_loader_version_range=[4,)

junit_version=5.10.2
