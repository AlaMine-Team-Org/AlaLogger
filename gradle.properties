# =============================================================================
# Ala Logger - single source of truth for versions and mod metadata.
#
# processResources (build-logic/src/main/groovy/multiloader-common.gradle)
# expands these into fabric.mod.json, so anything the metadata needs lives here
# rather than in the version catalog.
#
# KEEP EVERY VALUE ASCII. Gradle reads this file as ISO-8859-1, so a UTF-8
# character arrives in the jar double-encoded: an em dash in the description
# shipped as "alacraft.day .. you get" on the first build here, and the same trap
# once cost AlaIndustrial a mojibake release description. Escapes (\uXXXX) work,
# but are easy to mangle while editing; plain ASCII cannot.
#
# The description was the one value that wanted a character outside ASCII, so it
# no longer lives here: it is mod_description.txt, read as UTF-8 by build-logic.
# =============================================================================

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Must stay off: the configuration cache breaks the IntelliJ + Loom combination
# (FabricMC/fabric-loom#1349). The BUILD cache below is a different thing and is
# safe to keep on.
org.gradle.configuration-cache=false
org.gradle.caching=true

version=0.2.0
group=day.alacraft.alalogger
java_version=25

mod_id=alalogger
mod_name=Ala Logger
mod_author=AlaCraft
license=MIT
# description: see mod_description.txt

# Which Minecraft to build for. Every supported version has a file in versions/
# holding what differs between them (Minecraft, NeoForm, Fabric API, the loaders);
# settings.gradle loads the chosen one into every project. The default is the
# newest version; the older one is `./gradlew build -Pmc=26.2`. Both ship from
# the same source with the same version number, and CI builds and tests both.
# Java 25 is mandatory from 26.1 onwards.
mc=26.3

# The floors in versions/*.properties are what the mod declares, so raising one
# raises the requirement players see - keep the Requirements section of the store
# page in step with it.
#
# The FML loader spec version, not the NeoForge version. Separate on purpose:
# the loader format changes far less often than the platform, and the same range
# holds for NeoForge on 26.2 (FML 11) and 26.3 (FML 12).
neoforge_loader_version_range=[4,)

# MinecraftForge's javafml language provider, whose version is Forge's major
# version: 65 on 26.2, 66 on 26.3. The lower bound covers both lines; the
# minecraft dependency in mods.toml is what pins each jar to its game version.
forge_loader_version_range=[65,)


# ForgeGradle 7: put the classes and the resources of a source set in one
# directory for dev runs. Without it Forge sees META-INF/mods.toml in
# build/resources/main and no classes beside it, and refuses to load the mod
# ("constructed 0 mods"). The Forge 26.x MDK ships the same line. Only
# ForgeGradle reads it; the jar is not affected.
net.minecraftforge.gradle.merge-source-sets=true
