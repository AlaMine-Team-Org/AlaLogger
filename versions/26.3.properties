# =============================================================================
# Minecraft 26.3 "Wilderness Bound" - the default target (`mc=` in
# gradle.properties). Build it with `./gradlew build`.
#
# One file per supported game version; settings.gradle loads the chosen one into
# every project, so each key below is used exactly as it was when it lived in
# gradle.properties. Keys that do not depend on the game version (the mod
# version, Java, the FML loader spec) stay there - a key may live in only one of
# the two places, and settings.gradle refuses to build if it finds it in both.
#
# ASCII only: the file is read the same way gradle.properties is.
# =============================================================================

minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
# Compilation-only Minecraft classpath for the loader-neutral module, in Mojang
# mappings. https://maven.neoforged.net/releases/net/neoforged/neoform/
neo_form_version=26.3-1

fabric_version=0.161.0+26.3
fabric_loader_version=0.19.5

# NeoForge for 26.3 is in beta (no stable build as of 2026-09-23). The value is
# also the floor the mod declares, and the "-beta" in it is what the release
# workflow reads to publish this one file as a beta.
neoforge_version=26.3.0.10-beta

# MinecraftForge (not NeoForge). Stable since 66.1.0 ("26.3 RB 1", 2026-10-21),
# the recommended build on the day Forge support was added and the floor the mod
# declares.
forge_version=66.1.0

# Pack format of the Forge 26.3 MDK pack.mcmeta. Forge refuses a mod without one
# with a warning screen on every launch.
forge_pack_format=121
