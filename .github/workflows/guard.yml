# Installed into the PUBLIC repository at .github/workflows/guard.yml
#
# The net under a push that skipped the publishing helper. It runs the same
# cleanliness scan the helper runs locally, so a hand-made commit that introduces
# Cyrillic, a tooling trace, a credential or an internal path fails here rather
# than sitting in the repository unnoticed.
name: Cleanliness Guard

on:
  push:
  pull_request:
  workflow_dispatch:
  # Release notes change on the release page, not through a push, so an edit
  # there has to start the scan by itself.
  release:
    types: [published, edited]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, so commit metadata can be scanned

      - name: Scan the working tree
        run: bash .github/scripts/scan-clean.sh .

      # A clean tree can still sit on top of a commit whose author or message
      # says how it was made. Author lines are part of what a repository
      # publishes, and unlike file contents they cannot be edited afterwards
      # without rewriting history.
      - name: Scan the commit metadata
        run: |
          pattern="$(printf '%s|' \
            "c""laude" \
            "a""nthropic" \
            "co""pilot" \
            "c""odex" \
            "chat""gpt" \
            "open""ai" \
            "co-authored""-by" \
            "generated"" with" \
            "artificial"" intelligence" \
            "\\bg""pt\\b" \
            "\\bl""lm\\b" \
            "\\bA""I\\b" \
            | sed 's/|$//')"

          if git log --format='%an%n%ae%n%cn%n%ce%n%B' | grep -iE "$pattern"; then
            echo "::error::a tooling trace is present in the commit metadata"
            exit 1
          fi
          echo "commit metadata is clean"

      # The name and notes on every release page are published text as well,
      # and neither scan above reads them: they are not a file in the tree and
      # not a commit. A release body has already carried a commit trailer once,
      # so each one goes through the same gate as the tree - one file per
      # release, named after its tag, so a finding points at the page to fix.
      #
      # An empty file would scan as clean, so every file starts with the tag
      # itself, and a file that stays empty - or a count that comes up short -
      # stops the job instead of passing it.
      - name: Scan the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/release-notes"
          mkdir -p "$dir"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"

          # gh prints one JSON array per page: -s gathers the pages, add joins
          # them. -j writes no line endings at all, so the tags travel
          # NUL-separated and nothing can cling to a tag name.
          total=$(jq -j -s 'add // [] | length' "$RUNNER_TEMP/releases.json")
          count=0
          while IFS= read -r -d '' tag; do
            file="$dir/$(printf '%s' "$tag" | tr -c 'A-Za-z0-9._-' '_').md"
            jq -r -s --arg t "$tag" \
              'add | .[] | select(.tag_name == $t) | .tag_name, (.name // ""), (.body // "")' \
              "$RUNNER_TEMP/releases.json" > "$file"
            [ -s "$file" ] || { echo "::error::could not read the release $tag"; exit 1; }
            count=$((count + 1))
          done < <(jq -j -s 'add // [] | .[] | .tag_name + "\u0000"' "$RUNNER_TEMP/releases.json")

          if [ "$count" -ne "$total" ]; then
            echo "::error::read $count of $total releases - refusing to call the rest clean"
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "no releases yet - nothing to scan"
            exit 0
          fi
          echo "scanning the tag, name and notes of $total release(s)"
          bash .github/scripts/scan-clean.sh "$dir"
